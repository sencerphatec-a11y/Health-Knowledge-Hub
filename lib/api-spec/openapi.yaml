openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: medications
    description: Current U.S. human medication labels from DailyMed
paths:
  /doctors:
    get:
      operationId: searchDoctors
      tags: [health]
      summary: Find physician practice listings by city/state or ZIP code
      description: Searches public CMS NPPES records. Only active physician records with matching U.S. practice locations are shown. Listings do not verify licensing, insurance, availability, or quality.
      parameters:
        - name: city
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: state
          in: query
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
        - name: zip
          in: query
          schema:
            type: string
            pattern: "^[0-9]{5}$"
        - name: specialty
          in: query
          schema:
            type: string
            enum: [all, family-medicine, internal-medicine, pediatrics, ob-gyn, cardiology, dermatology, psychiatry, general-practice]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 1
      responses:
        "200":
          description: Matching physician practice listings on this directory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorSearchPage"
        "400":
          description: Supply a valid ZIP code or a city and state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: CMS directory unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Search service busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /medication-labels:
    get:
      operationId: getMedicationLabels
      tags: [medications]
      summary: Search current U.S. human drug labels
      description: Returns current DailyMed human prescription, OTC, compounded medicine, vaccine, allergen, plasma derivative, and cellular therapy label records.
      parameters:
        - name: query
          in: query
          required: false
          description: Search by a generic or brand medication name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
      responses:
        "200":
          description: Medication label results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationCatalogPage"
        "400":
          description: Invalid search query or page number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: DailyMed is unavailable or returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /medication-labels/{setId}:
    get:
      operationId: getMedicationLabel
      tags: [medications]
      summary: Get a medication label's labeled uses
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Medication label and labeled uses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationLabelDetail"
        "404":
          description: Medication label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: DailyMed is unavailable or returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    PhysicianPractice:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        phone:
          type: [string, "null"]
      required: [address, city, state, postalCode, phone]
    PhysicianListing:
      type: object
      properties:
        npi:
          type: string
        name:
          type: string
        credential:
          type: [string, "null"]
        specialties:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            $ref: "#/components/schemas/PhysicianPractice"
        sourceUrl:
          type: string
        lastUpdated:
          type: [string, "null"]
      required: [npi, name, credential, specialties, locations, sourceUrl, lastUpdated]
    DoctorSearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhysicianListing"
        page:
          type: integer
        hasMore:
          type: boolean
        limitReached:
          type: boolean
        directoryRecordsOnPage:
          type: integer
        retrievedAt:
          type: string
        sourceUrl:
          type: string
      required: [items, page, hasMore, limitReached, directoryRecordsOnPage, retrievedAt, sourceUrl]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MedicationLabelType:
      type: string
      enum:
        - prescription
        - otc
        - compounded
        - vaccine
        - plasma-derivative
        - cellular-therapy
        - licensed-cell-product
        - allergenic
        - standardized-allergenic
    MedicationLabel:
      type: object
      properties:
        setId:
          type: string
          format: uuid
        title:
          type: string
        publishedDate:
          type: string
        labelType:
          $ref: "#/components/schemas/MedicationLabelType"
        sourceUrl:
          type: string
          format: uri
      required: [setId, title, publishedDate, labelType, sourceUrl]
    MedicationCatalogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MedicationLabel"
        query:
          type: string
          nullable: true
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        catalogUpdatedAt:
          type: string
          format: date-time
      required: [items, query, page, pageSize, totalItems, totalPages, catalogUpdatedAt]
    MedicationLabelDetail:
      allOf:
        - $ref: "#/components/schemas/MedicationLabel"
        - type: object
          properties:
            labelEffectiveDate:
              type: string
              nullable: true
            usesText:
              type: string
              nullable: true
          required: [labelEffectiveDate, usesText]
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [message]

